# Setup plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'

# Setup window mode
# set -g mouse on
set -g default-terminal 'screen-256color'
set-option -g default-shell '/usr/bin/fish'
set-window-option -g mode-keys 'vi'

# Setup prefix key bindings
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Setup window key bindings
bind -n C-n new-window
bind -n M-S-Left previous-window
bind -n M-S-Right next-window

# Setup pane key bindings
bind -n C-h split-window -h
bind -n C-v split-window -v
bind -n C-l list-panes
bind -n C-u resize-pane -Z
bind -n C-b break-pane
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Setup clipboard key bindings
bind -n C-Space copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xsel -i -p && xsel -o -p | xsel -i -b'
bind-key p run 'xsel -o | tmux load-buffer - ; tmux paste-buffer'

# Initialize tmuxline
if-shell 'test -f ~/.tmuxline.conf' 'source ~/.tmuxline.conf'

# Initialize tmux plugin manager
run '~/.tmux/plugins/tpm/tpm'
